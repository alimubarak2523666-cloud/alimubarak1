<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Bag · THE EDIT by ALI MUBARAK</title>
<style>
  :root{--bg:#060507;--ink:#fff;--muted:#B8B5AD;--line:rgba(244,241,234,.12);--gold:#C9A86A;--gold-2:#E7D3A6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:rgba(6,5,7,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .brand{font-weight:700;letter-spacing:.2em;font-size:13px}.brand span{color:var(--gold)}
  .back{color:var(--muted);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:8px 16px;border-radius:40px}
  .back:hover{color:#fff}
  .wrap{max-width:680px;margin:0 auto;padding:34px 20px 80px}
  h1{font-size:clamp(26px,5vw,38px);font-weight:700;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin-top:6px}
  .line{display:flex;gap:16px;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px;background:rgba(255,255,255,.02);align-items:center}
  .line img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line);flex:none}
  .li-name{font-size:15px;font-weight:700}
  .li-opts{color:var(--gold-2);font-size:12.5px;margin-top:4px}
  .li-price{color:var(--muted);font-size:13px;margin-top:4px}
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:30px;overflow:hidden;flex:none}
  .stepper button{width:38px;height:38px;background:transparent;border:0;color:var(--gold-2);font-size:18px;cursor:pointer;font-family:inherit}
  .stepper button:hover{background:rgba(201,168,106,.12)}
  .stepper span{min-width:34px;text-align:center;font-weight:700;font-size:15px}
  .li-total{font-weight:700;font-size:15px;min-width:80px;text-align:right;flex:none}
  .rm{background:transparent;border:0;color:#8a6a6a;font-size:17px;cursor:pointer;flex:none;padding:6px}
  .rm:hover{color:#e08080}
  .summary{border:1px solid rgba(201,168,106,.35);border-radius:18px;padding:20px;margin-top:24px;background:rgba(201,168,106,.04)}
  .srow{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:var(--muted)}
  .srow b{color:#fff}
  .srow.gift{color:var(--gold-2)}
  .srow.total{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:16px;color:#fff;font-weight:700}
  .cta{display:block;width:100%;height:52px;margin-top:18px;border:0;border-radius:40px;background:var(--gold);color:#1a1407;font-weight:700;font-size:15.5px;cursor:pointer;font-family:inherit;text-align:center;line-height:52px;text-decoration:none}
  .cta:hover{background:var(--gold-2)}
  .cont{display:block;text-align:center;color:var(--gold-2);font-size:13.5px;margin-top:16px;text-decoration:none}
  .empty{border:1px solid var(--line);border-radius:18px;padding:40px 20px;text-align:center;color:var(--muted);margin-top:20px}
  .note{color:var(--muted);font-size:12px;margin-top:12px;text-align:center;line-height:1.6}
  @media(max-width:560px){.line{flex-wrap:wrap}.li-total{min-width:0}}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="store-experience-morph.html">← Continue shopping</a>
  <div class="brand">MY BAG <span>· THE EDIT</span></div>
  <a class="back" href="store-account.html#orders">My account</a>
</div>
<div class="wrap">
  <h1>My bag</h1>
  <div class="sub" id="count"></div>
  <div id="body"></div>
</div>

<script src="theedit-data.js?v=9"></script>
<script>
(function(){
  function sessU(){try{return JSON.parse(localStorage.getItem('theedit_user')||'null');}catch(e){return null;}}
  function cartGet(){try{return JSON.parse(localStorage.getItem('theedit_cart')||'[]');}catch(e){return [];}}
  function cartSet(c){localStorage.setItem('theedit_cart',JSON.stringify(c));}
  // escape user-entered text before it goes into innerHTML (XSS protection)
  function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}

  function render(){
    const cart=cartGet();
    const B=document.getElementById('body');
    const n=cart.reduce((s,l)=>s+l.qty,0);
    document.getElementById('count').textContent=n?(n+' item'+(n===1?'':'s')+' in your bag'):'';
    if(!cart.length){
      B.innerHTML=`<div class="empty">Your bag is empty.<br><br><a class="cta" style="max-width:280px;margin:0 auto" href="store-experience-morph.html#price">See the drop →</a></div>`;
      return;
    }
    const sub=cart.reduce((s,l)=>s+l.qty*l.p,0);
    const u=sessU();
    const bal=u?TE.giftBalance(u.email):0;
    const gift=Math.min(bal,sub);
    B.innerHTML=cart.map((l,i)=>`
      <div class="line">
        ${l.img?`<img src="${esc(l.img)}" onerror="this.style.display='none'">`:''}
        <div style="flex:1;min-width:140px">
          <div class="li-name">${esc(l.n)}</div>
          ${l.opts?`<div class="li-opts">${esc(l.opts)}</div>`:''}
          <div class="li-price">${l.p} KWD each</div>
          ${(function(){const pr=TE.productById?TE.productById(l.productId):null;
             if(!pr)return '';
             if(pr.left<=0)return '<div style="color:#e08080;font-size:12px;margin-top:4px">Sold out — remove or check out fast</div>';
             if(pr.left<=3)return '<div style="color:var(--gold-2);font-size:12px;margin-top:4px">Only '+pr.left+' left</div>';
             return '';})()}
        </div>
        <div class="stepper">
          <button data-minus="${i}">−</button><span>${l.qty}</span><button data-plus="${i}">+</button>
        </div>
        <div class="li-total">${Math.round(l.qty*l.p*100)/100} KWD</div>
        <button class="rm" data-rm="${i}" title="Remove">✕</button>
      </div>`).join('')+`
      <div class="summary">
        <div class="srow"><span>Subtotal (${n} item${n===1?'':'s'})</span><b>${Math.round(sub*100)/100} KWD</b></div>
        <div class="srow"><span>Delivery</span><span>Calculated at checkout by area</span></div>
        ${u?(bal>0?`<div class="srow gift"><span>🎁 Gift balance — applied at checkout</span><span>−${gift} KWD</span></div>`:'')
           :`<div class="srow gift"><span>🎁 Have gift cards? <a href="store-login.html" style="color:var(--gold-2)">Sign in</a> to use them</span><span></span></div>`}
        <div class="srow total"><span>Estimated total</span><span>${Math.max(0,Math.round((sub-gift)*100)/100)} KWD + delivery</span></div>
        <a class="cta" href="store-experience-morph.html?co=1#price">Proceed to checkout →</a>
        <div class="note">Cash on delivery or payment link · Kuwait same-day by our drivers · GCC by courier</div>
      </div>
      <a class="cont" href="store-experience-morph.html#price">← Continue shopping</a>`;
    document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{
      const c=cartGet();const i=+b.dataset.plus;
      const prod=TE.productById?TE.productById(c[i].productId):null;
      const left=prod?prod.left:99;
      const inBag=c.filter(l=>l.productId===c[i].productId).reduce((s,l)=>s+l.qty,0);
      if(inBag>=left){alert(left<=0?'This drop is sold out.':'Only '+left+' available — that\'s everything we have.');return;}
      c[i].qty++;cartSet(c);render();});
    document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const c=cartGet();const i=+b.dataset.minus;c[i].qty--;if(c[i].qty<=0)c.splice(i,1);cartSet(c);render();});
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const c=cartGet();c.splice(+b.dataset.rm,1);cartSet(c);render();});
  }
  render();
  // live refresh: stock hints / gift balance update if data changes while page is open
  if(window.TE&&TE.on)TE.on(()=>render());
})();
</script>
</body>
</html>
