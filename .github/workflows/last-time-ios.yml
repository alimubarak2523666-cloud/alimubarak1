name: Last Time iOS build

on:
  pull_request:
    paths:
      - "LastTime/**"
      - ".github/workflows/last-time-ios.yml"
  push:
    branches: [main]
    paths:
      - "LastTime/**"
      - ".github/workflows/last-time-ios.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build app and widget for the iOS Simulator
        run: |
          xcodebuild build \
            -project LastTime/LastTime.xcodeproj \
            -target LastTime \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
