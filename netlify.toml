[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# THE EDIT preview: store is the landing page (302 = reversible until the full build)
[[redirects]]
  from = "/"
  to = "/store/"
  status = 302
  force = true

# Serve the static store before Next.js locale middleware can intercept
[[redirects]]
  from = "/store"
  to = "/store/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/store/"
  to = "/store/index.html"
  status = 200
  force = true
